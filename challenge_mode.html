<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#bcdcff" />
  <title>루이 체리 게임 — 도전모드 Beta</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #bcdcff;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #1a1a1a;
      overflow: hidden;
    }
    #challenge-screen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    #ch-hud {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 48px;
      padding:
        max(6px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        6px
        max(12px, env(safe-area-inset-left));
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      -webkit-tap-highlight-color: transparent;
    }
    .ch-hud-stats {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 0;
      min-width: 0;
    }
    .ch-stat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      margin: 0;
      min-width: 0;
      padding: 4px 6px;
    }
    .ch-stat span {
      opacity: 0.65;
      font-weight: 600;
      font-size: 0.65rem;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }
    .ch-stat strong {
      font-size: clamp(1.05rem, 5vw, 1.25rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
      color: #1a4a8a;
    }
    .ch-hud-divider {
      width: 1px;
      align-self: center;
      height: 28px;
      background: rgba(26, 74, 138, 0.15);
      flex-shrink: 0;
    }
    #ch-home-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border: none;
      border-radius: 10px;
      background: #ffe066;
      color: #1a4a8a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    #ch-home-btn svg { width: 24px; height: 24px; fill: currentColor; }
    #ch-bonus-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      min-width: 44px;
      height: 44px;
      padding: 2px 8px;
      border: none;
      border-radius: 10px;
      background: #ff6b6b;
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
      font: inherit;
    }
    #ch-bonus-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      background: #c9c9c9;
      color: #666;
    }
    #ch-bonus-btn .ch-bonus-label {
      font-size: 0.58rem;
      font-weight: 700;
      line-height: 1.1;
    }
    #ch-bonus-btn strong {
      font-size: 0.95rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    #ch-toast {
      display: none;
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      z-index: 12;
      padding: 14px 22px;
      border-radius: 12px;
      background: rgba(26, 74, 138, 0.92);
      color: #fff;
      font-size: clamp(1rem, 4.5vw, 1.2rem);
      font-weight: 800;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      pointer-events: none;
      white-space: nowrap;
    }
    #ch-toast.show {
      display: block;
      animation: ch-toast-pop 0.25s ease-out;
    }
    @keyframes ch-toast-pop {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.88); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    #ch-roulette {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 14;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }
    #ch-roulette.show {
      display: flex;
    }
    .ch-roulette-box {
      background: #fff;
      border: 3px solid #ffe066;
      border-radius: 16px;
      padding: 20px 28px 24px;
      text-align: center;
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.28);
      min-width: min(88vw, 220px);
    }
    .ch-roulette-title {
      margin: 0 0 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #1a4a8a;
      letter-spacing: 0.04em;
    }
    .ch-roulette-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 72px;
      border-radius: 12px;
      background: linear-gradient(180deg, #f0f6ff 0%, #d4e6ff 100%);
      border: 2px solid rgba(26, 74, 138, 0.2);
      overflow: hidden;
    }
    #ch-roulette-num {
      font-size: clamp(2.4rem, 12vw, 3.2rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #ff6b6b;
      line-height: 1;
      transition: transform 0.08s ease-out;
    }
    #ch-roulette.spinning #ch-roulette-num {
      animation: ch-roulette-tick 0.1s ease-out;
    }
    #ch-roulette.landed #ch-roulette-num {
      animation: ch-roulette-land 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
      color: #1a4a8a;
    }
    @keyframes ch-roulette-tick {
      0% { transform: translateY(-6px); opacity: 0.5; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes ch-roulette-land {
      0% { transform: scale(1.35); }
      70% { transform: scale(0.92); }
      100% { transform: scale(1); }
    }
    #ch-board-wrap.bomb-picking #ch-board {
      cursor: crosshair;
    }
    @media (max-width: 360px) {
      #ch-hud {
        gap: 6px;
        min-height: 44px;
      }
      .ch-stat {
        padding: 2px 4px;
      }
      .ch-stat span {
        font-size: 0.6rem;
      }
      .ch-hud-divider {
        height: 24px;
      }
    }
    #ch-board-wrap {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }
    #ch-board {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    #ch-board.dragging { cursor: grabbing; }
    #ch-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
    }
    #ch-overlay.show { display: flex; }
    .ch-modal {
      background: #2d5016;
      border: 2px solid #ffe066;
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
      max-width: 90vw;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    .ch-modal h2 { margin: 0 0 12px; color: #fff; font-size: 1.2rem; }
    .ch-modal p { margin: 0 0 20px; color: #fff; line-height: 1.5; }
    .ch-modal-btn {
      font: inherit;
      font-weight: 600;
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      background: #ffe066;
      color: #1a1a1a;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="challenge-screen">
    <header id="ch-hud">
      <div class="ch-hud-stats" aria-label="점수">
        <p class="ch-stat"><span>현재</span><strong id="ch-score">0</strong></p>
        <div class="ch-hud-divider" aria-hidden="true"></div>
        <p class="ch-stat"><span>최고</span><strong id="ch-high">0</strong></p>
      </div>
      <button type="button" id="ch-bonus-btn" disabled aria-label="보너스 사용">
        <span class="ch-bonus-label">보너스</span>
        <strong id="ch-bonus-count">0</strong>
      </button>
      <button type="button" id="ch-home-btn" aria-label="홈 화면">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 11h2v9h5v-6h4v6h5v-9h2L12 3z"/></svg>
      </button>
    </header>
    <div id="ch-board-wrap">
      <canvas id="ch-board"></canvas>
      <div id="ch-toast" role="status" aria-live="polite"></div>
      <div id="ch-roulette" aria-hidden="true">
        <div class="ch-roulette-box">
          <p class="ch-roulette-title">보너스 룰렛</p>
          <div class="ch-roulette-slot">
            <span id="ch-roulette-num">1</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="ch-overlay" aria-hidden="true">
    <div class="ch-modal">
      <h2>게임 종료</h2>
      <p id="ch-end-msg"></p>
      <button type="button" class="ch-modal-btn" id="ch-end-home">홈 화면</button>
    </div>
  </div>

  <script>
    const HEX_COLS = 8;
    const VISIBLE_ROWS = 16;
    const SCORE_PER_TILE = 5;
    const GUIDED_BREAK_LIMIT = 30;
    const HIGH_SCORE_KEY = "luise-challenge-highscore";
    const START_EMPTY_COLS = [3, 4];
    const BONUS_SCORE_STEP = 1000;
    const BOMB_TOAST_MS = 1500;
    const CLEAR_POP_SRC = "./clear-pop.png";

    const MIN_DRAG_MERGE_PX = 14;

    const canvas = document.getElementById("ch-board");
    const ctx = canvas.getContext("2d");
    const wrap = document.getElementById("ch-board-wrap");
    const scoreEl = document.getElementById("ch-score");
    const highEl = document.getElementById("ch-high");
    const bonusBtn = document.getElementById("ch-bonus-btn");
    const bonusCountEl = document.getElementById("ch-bonus-count");
    const toastEl = document.getElementById("ch-toast");
    const rouletteEl = document.getElementById("ch-roulette");
    const rouletteNumEl = document.getElementById("ch-roulette-num");
    const overlay = document.getElementById("ch-overlay");
    const endMsgEl = document.getElementById("ch-end-msg");
    const endHomeBtn = document.getElementById("ch-end-home");

    let grid = new Map();
    let minRow = 0;
    let viewBottomRow = VISIBLE_ROWS - 1;
    let hexSize = 24;
    let originX = 0;
    let originY = 0;
    let score = 0;
    let highScore = 0;
    let mergeCount = 0;
    let tilesBroken = 0;
    let gameRunning = false;
    let drag = null;
    let popEffects = [];
    let bonusCredits = 0;
    let bonusMilestonesGranted = 0;
    let bombPhase = "idle";
    let bombPicksLeft = 0;
    let bombToastTimer = null;
    let rouletteStepTimer = null;
    const clearPopImage = new Image();
    let clearPopReady = false;
    clearPopImage.addEventListener("load", () => {
      clearPopReady = true;
      draw();
    });
    clearPopImage.src = CLEAR_POP_SRC;

    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function playTone(freq, when, dur, vol, wave) {
      const ctx = ensureAudio();
      const t0 = when == null ? ctx.currentTime : when;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = wave || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }

    function playRouletteTickSound(step, totalSpins) {
      try {
        const progress = Math.min(1, step / Math.max(1, totalSpins));
        const freq = 440 + progress * 640;
        playTone(freq, null, 0.04, 0.1, "square");
      } catch (_) {}
    }

    function playRouletteLandSound(result) {
      try {
        const ctx = ensureAudio();
        const now = ctx.currentTime;
        const notes = [659.25, 830.61, 987.77, 1174.66];
        notes.forEach((f, i) => {
          playTone(f, now + i * 0.075, 0.11, 0.2, "triangle");
        });
        const peak = [1046.5, 1174.66, 1318.51, 1567.98, 1760][result - 1] || 1318.51;
        playTone(peak, now + 0.32, 0.22, 0.28, "triangle");
        playTone(peak * 1.25, now + 0.38, 0.14, 0.14, "sine");
      } catch (_) {}
    }

    function playBombSound() {
      try {
        const ctx = ensureAudio();
        const now = ctx.currentTime;
        const boom = ctx.createOscillator();
        const boomGain = ctx.createGain();
        boom.type = "sawtooth";
        boom.frequency.setValueAtTime(280, now);
        boom.frequency.exponentialRampToValueAtTime(48, now + 0.14);
        boomGain.gain.setValueAtTime(0.0001, now);
        boomGain.gain.exponentialRampToValueAtTime(0.32, now + 0.01);
        boomGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);
        boom.connect(boomGain);
        boomGain.connect(ctx.destination);
        boom.start(now);
        boom.stop(now + 0.28);

        playTone(520, now, 0.035, 0.18, "square");
        playTone(130, now + 0.03, 0.12, 0.14, "triangle");
      } catch (_) {}
    }

    function playClearSound(clearedCount) {
      try {
        const base = Math.max(1, Math.floor(clearedCount || 1));
        const n = Math.max(1, Math.min(24, base >= 2 ? (base - 1) * 4 : 1));
        const now = ensureAudio().currentTime;
        const master = audioCtx.createGain();
        master.gain.setValueAtTime(0.0001, now);
        master.gain.exponentialRampToValueAtTime(1.68, now + 0.01);
        const step = 0.075;
        const totalDur = Math.min(0.95, 0.10 + n * step);
        master.gain.exponentialRampToValueAtTime(0.0001, now + totalDur);
        master.connect(audioCtx.destination);
        const freqs = [740.0, 880.0, 1108.73, 1320.0, 1760.0, 2217.46];
        for (let i = 0; i < n; i++) {
          const t0 = now + i * step;
          const t1 = t0 + step * 0.98;
          const f = freqs[Math.min(freqs.length - 1, i)];
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(f, t0);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(1.20, t0 + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t1);
          osc.connect(g);
          g.connect(master);
          osc.start(t0);
          osc.stop(t1 + 0.01);
        }
      } catch (_) {}
    }

    function key(c, r) {
      return c + "," + r;
    }

    function getCell(c, r) {
      return grid.get(key(c, r));
    }

    function setCell(c, r, cell) {
      const k = key(c, r);
      if (cell == null) grid.delete(k);
      else grid.set(k, cell);
    }

    function makeHidden(value) {
      return { state: "hidden", value: value };
    }

    function makeRevealed(value) {
      return { state: "revealed", value: value };
    }

    function makeEmpty() {
      return { state: "empty" };
    }

    function ensureCell(c, r) {
      const cell = getCell(c, r);
      if (cell) return cell;
      const created = makeHidden(randValue());
      setCell(c, r, created);
      return created;
    }

    function getRevealedValue(c, r) {
      const cell = getCell(c, r);
      if (!cell || cell.state !== "revealed") return null;
      return cell.value;
    }

    function isEmptyCell(c, r) {
      const cell = getCell(c, r);
      return cell && cell.state === "empty";
    }

    function centerDist2(c1, r1, c2, r2) {
      const a = hexCenter(c1, r1);
      const b = hexCenter(c2, r2);
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return dx * dx + dy * dy;
    }

    function neighbors(col, row) {
      const list = [];
      for (const [k, cell] of grid) {
        if (!cell || cell.state === "empty") continue;
        const parts = k.split(",");
        const c = +parts[0];
        const r = +parts[1];
        if (c === col && r === row) continue;
        list.push({ c, r, d2: centerDist2(col, row, c, r) });
      }
      if (!list.length) return [];
      list.sort((a, b) => a.d2 - b.d2);
      const minD2 = list[0].d2;
      const band = Math.max(hexSize * hexSize * 0.12, minD2 * 0.18);
      const cutoff = minD2 + band;
      const out = [];
      for (const p of list) {
        if (p.d2 <= cutoff) out.push([p.c, p.r]);
        else break;
      }
      return out;
    }

    function isHexNeighbor(c1, r1, c2, r2) {
      return neighbors(c1, r1).some(([nc, nr]) => nc === c2 && nr === r2);
    }

    function canMergeCells(c1, r1, c2, r2) {
      if (c1 === c2 && r1 === r2) return false;
      const v1 = getRevealedValue(c1, r1);
      const v2 = getRevealedValue(c2, r2);
      return v1 != null && v2 != null && v1 + v2 === 10;
    }

    function forEachRevealedInView(fn) {
      const topRow = getViewTopRow();
      for (let r = topRow; r <= viewBottomRow; r++) {
        for (let c = 0; c < HEX_COLS; c++) {
          const v = getRevealedValue(c, r);
          if (v != null) fn(c, r, v);
        }
      }
    }

    function getViewTopRow() {
      return viewBottomRow - VISIBLE_ROWS + 1;
    }

    function hexCenter(col, row) {
      const topRow = getViewTopRow();
      const x = hexSize * (Math.sqrt(3) * (col + 0.5 * (row & 1)));
      const y = hexSize * (1.5 * (row - topRow));
      return { x: originX + x, y: originY + y };
    }

    function pixelToHexAny(px, py) {
      let best = null;
      let bestD = Infinity;
      const topRow = getViewTopRow();
      for (let r = topRow; r <= viewBottomRow; r++) {
        for (let c = 0; c < HEX_COLS; c++) {
          const cell = getCell(c, r);
          if (!cell || cell.state === "empty") continue;
          const { x, y } = hexCenter(c, r);
          const dx = px - x;
          const dy = py - y;
          const d = dx * dx + dy * dy;
          if (d < bestD) {
            bestD = d;
            best = [c, r];
          }
        }
      }
      if (!best || bestD > hexSize * hexSize * 1.35) return null;
      return best;
    }

    function pixelToHex(px, py, onlyRevealed, skipC, skipR) {
      let best = null;
      let bestD = Infinity;
      const topRow = getViewTopRow();
      for (let r = topRow; r <= viewBottomRow; r++) {
        for (let c = 0; c < HEX_COLS; c++) {
          if (skipC != null && skipR != null && c === skipC && r === skipR) continue;
          const cell = getCell(c, r);
          if (!cell || cell.state === "empty") continue;
          if (onlyRevealed && cell.state !== "revealed") continue;
          const { x, y } = hexCenter(c, r);
          const dx = px - x;
          const dy = py - y;
          const d = dx * dx + dy * dy;
          if (d < bestD) {
            bestD = d;
            best = [c, r];
          }
        }
      }
      if (!best || bestD > hexSize * hexSize * 1.35) return null;
      return best;
    }

    function nearestMergeableAt(fromC, fromR, px, py) {
      const dropLimit2 = hexSize * hexSize * 1.35;
      let best = null;
      let bestD = Infinity;
      forEachRevealedInView((c, r) => {
        if (c === fromC && r === fromR) return;
        if (!canMergeCells(fromC, fromR, c, r)) return;
        const { x, y } = hexCenter(c, r);
        const d = (px - x) * (px - x) + (py - y) * (py - y);
        if (d < bestD) {
          bestD = d;
          best = [c, r];
        }
      });
      if (!best || bestD > dropLimit2) return null;
      return best;
    }

    function resolveMergeTarget(
      fromC,
      fromR,
      dragValue,
      releaseX,
      releaseY,
      hitC,
      hitR,
      hoverC,
      hoverR
    ) {
      if (dragValue == null) return null;

      function pick(c, r) {
        if (c == null || r == null) return null;
        if (c === fromC && r === fromR) return null;
        if (!canMergeCells(fromC, fromR, c, r)) return null;
        return [c, r];
      }

      const hoverPick = pick(hoverC, hoverR);
      if (hoverPick) return hoverPick;

      const hitPick = pick(hitC, hitR);
      if (hitPick) return hitPick;

      return nearestMergeableAt(fromC, fromR, releaseX, releaseY);
    }

    function pushRowAbove() {
      minRow--;
      for (let c = 0; c < HEX_COLS; c++) {
        setCell(c, minRow, makeHidden(randValue()));
      }
    }

    function deleteRow(r) {
      for (let c = 0; c < HEX_COLS; c++) {
        grid.delete(key(c, r));
      }
    }

    function rowHasPlayableCell(r) {
      for (let c = 0; c < HEX_COLS; c++) {
        const cell = getCell(c, r);
        if (cell && cell.state !== "empty") return true;
      }
      return false;
    }

    function ensureRowExists(r) {
      while (minRow > r) {
        pushRowAbove();
      }
      return true;
    }

    function isVisibleRow(r) {
      const top = viewBottomRow - VISIBLE_ROWS + 1;
      return r >= top && r <= viewBottomRow;
    }

    function randValue() {
      return 1 + Math.floor(Math.random() * 9);
    }

    function randValueLow() {
      return 1 + Math.floor(Math.random() * 5);
    }

    function randPairHalf() {
      const pairs = [
        [1, 9],
        [2, 8],
        [3, 7],
        [4, 6],
        [5, 5],
      ];
      const p = pairs[Math.floor(Math.random() * pairs.length)];
      return Math.random() < 0.5 ? p[0] : p[1];
    }

    function complementOf(n) {
      const v = 10 - n;
      return v >= 1 && v <= 9 ? v : null;
    }

    function getRevealedNeighborsOf(c, r) {
      const out = [];
      for (const [nc, nr] of neighbors(c, r)) {
        const v = getRevealedValue(nc, nr);
        if (v != null) out.push({ c: nc, r: nr, v });
      }
      return out;
    }

    function applyTempReveal(toReveal, values) {
      for (let i = 0; i < toReveal.length; i++) {
        const cell = toReveal[i][2];
        cell.value = values[i];
        cell.state = "revealed";
      }
    }

    function revertTempReveal(toReveal) {
      for (let i = 0; i < toReveal.length; i++) {
        const cell = toReveal[i][2];
        cell.state = "hidden";
      }
    }

    function ensurePlayableAfterReveal(toReveal, values) {
      applyTempReveal(toReveal, values);
      if (hasMergeMove()) {
        revertTempReveal(toReveal);
        return values;
      }

      if (toReveal.length >= 2) {
        for (let i = 0; i < toReveal.length; i++) {
          const [c, r] = toReveal[i];
          for (let j = i + 1; j < toReveal.length; j++) {
            const [c2, r2] = toReveal[j];
            if (!isHexNeighbor(c, r, c2, r2)) continue;
            const a = randValueLow();
            values[i] = a;
            values[j] = 10 - a;
            applyTempReveal(toReveal, values);
            if (hasMergeMove()) {
              revertTempReveal(toReveal);
              return values;
            }
          }
        }
      }

      for (let i = 0; i < toReveal.length; i++) {
        const [c, r] = toReveal[i];
        const adj = getRevealedNeighborsOf(c, r);
        for (const nb of adj) {
          const comp = complementOf(nb.v);
          if (comp == null) continue;
          values[i] = comp;
          applyTempReveal(toReveal, values);
          if (hasMergeMove()) {
            revertTempReveal(toReveal);
            return values;
          }
        }
      }

      for (let i = 0; i < toReveal.length; i++) {
        values[i] = randPairHalf();
      }
      if (toReveal.length >= 2 && !values.some((v) => v <= 5)) {
        values[Math.floor(Math.random() * toReveal.length)] = randValueLow();
      }
      revertTempReveal(toReveal);
      return values;
    }

    function assignRevealValues(toReveal) {
      const count = toReveal.length;
      if (count === 0) return [];

      const guided = tilesBroken < GUIDED_BREAK_LIMIT;
      const values = new Array(count).fill(null);

      if (guided) {
        for (let i = 0; i < count; i++) {
          if (values[i] != null) continue;
          const [c, r] = toReveal[i];
          for (let j = i + 1; j < count; j++) {
            if (values[j] != null) continue;
            const [c2, r2] = toReveal[j];
            if (!isHexNeighbor(c, r, c2, r2)) continue;
            const a = randValueLow();
            values[i] = a;
            values[j] = 10 - a;
            break;
          }
        }
        for (let i = 0; i < count; i++) {
          if (values[i] != null) continue;
          const [c, r] = toReveal[i];
          const adj = getRevealedNeighborsOf(c, r);
          if (adj.length > 0 && Math.random() < 0.35) {
            const comp = complementOf(adj[Math.floor(Math.random() * adj.length)].v);
            if (comp != null) values[i] = comp;
          }
        }
        for (let i = 0; i < count; i++) {
          if (values[i] == null) values[i] = randPairHalf();
        }
        if (count >= 2 && !values.some((v) => v <= 5)) {
          values[Math.floor(Math.random() * count)] = randValueLow();
        }
        return ensurePlayableAfterReveal(toReveal, values);
      }

      for (let i = 0; i < count; i++) values[i] = randValue();
      if (count >= 2 && !values.some((v) => v <= 5)) {
        values[Math.floor(Math.random() * count)] = randValueLow();
      }
      return values;
    }

    const ROWS_BUFFER_ABOVE = 4;

    function ensureRowsAbove() {
      const topRow = getViewTopRow();
      const wantMin = topRow - ROWS_BUFFER_ABOVE;
      while (minRow > wantMin) {
        pushRowAbove();
      }
    }

    function fillInitialBoard() {
      grid.clear();
      minRow = 0;
      viewBottomRow = VISIBLE_ROWS - 1;
      const startPairs = [
        [4, 6],
        [3, 7],
        [5, 5],
        [2, 8],
        [1, 9],
      ];
      const pair = startPairs[Math.floor(Math.random() * startPairs.length)];
      for (let r = minRow; r <= viewBottomRow; r++) {
        for (let c = 0; c < HEX_COLS; c++) {
          setCell(c, r, makeHidden(randValue()));
        }
      }
      setCell(START_EMPTY_COLS[0], viewBottomRow, makeRevealed(pair[0]));
      setCell(START_EMPTY_COLS[1], viewBottomRow, makeRevealed(pair[1]));
    }

    function revealedTileCount() {
      let n = 0;
      for (const cell of grid.values()) {
        if (cell.state === "revealed") n++;
      }
      return n;
    }

    function hasMergeMove() {
      const tiles = [];
      for (const [k, cell] of grid) {
        if (cell.state !== "revealed") continue;
        const parts = k.split(",");
        tiles.push(cell.value);
      }
      for (let i = 0; i < tiles.length; i++) {
        for (let j = i + 1; j < tiles.length; j++) {
          if (tiles[i] + tiles[j] === 10) return true;
        }
      }
      return false;
    }

    function getMaxOccupiedRow() {
      let maxR = -Infinity;
      for (const [k, cell] of grid) {
        if (!cell || cell.state === "empty") continue;
        const r = parseInt(k.split(",")[1], 10);
        if (r > maxR) maxR = r;
      }
      return maxR === -Infinity ? viewBottomRow : maxR;
    }

    function pruneRowsBelow(maxR) {
      for (const k of [...grid.keys()]) {
        const r = parseInt(k.split(",")[1], 10);
        if (r > maxR) grid.delete(k);
      }
    }

    function trimBottomEmptyRows() {
      while (viewBottomRow > minRow && !rowHasPlayableCell(viewBottomRow)) {
        deleteRow(viewBottomRow);
        viewBottomRow--;
      }
    }

    function syncViewport() {
      const prevBottom = viewBottomRow;
      trimBottomEmptyRows();
      let maxR = getMaxOccupiedRow();
      if (maxR === -Infinity) maxR = minRow;
      viewBottomRow = maxR;
      pruneRowsBelow(viewBottomRow);
      const dropped = Math.max(0, prevBottom - viewBottomRow);
      for (let i = 0; i < dropped; i++) {
        pushRowAbove();
      }
      ensureRowsAbove();
    }

    function scheduleLayout() {
      requestAnimationFrame(() => {
        resize();
        draw();
        requestAnimationFrame(() => {
          resize();
          draw();
        });
      });
    }

    function uniqueNeighborCells(cells) {
      const set = new Set();
      const list = [];
      for (const [c, r] of cells) {
        for (const [nc, nr] of neighbors(c, r)) {
          const k = key(nc, nr);
          if (!set.has(k)) {
            set.add(k);
            list.push([nc, nr]);
          }
        }
      }
      return list;
    }

    function updateBonusButton() {
      bonusCountEl.textContent = String(bonusCredits);
      bonusBtn.disabled =
        !gameRunning || bonusCredits < 1 || bombPhase !== "idle";
    }

    function grantBonusMilestones() {
      const milestone = Math.floor(score / BONUS_SCORE_STEP);
      while (bonusMilestonesGranted < milestone) {
        bonusMilestonesGranted++;
        bonusCredits++;
      }
      updateBonusButton();
    }

    function showBombToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
    }

    function hideBombToast() {
      toastEl.classList.remove("show");
    }

    function cancelRoulette() {
      if (rouletteStepTimer) {
        clearTimeout(rouletteStepTimer);
        rouletteStepTimer = null;
      }
      rouletteEl.classList.remove("show", "spinning", "landed");
      rouletteEl.setAttribute("aria-hidden", "true");
    }

    function runBombRoulette(finalN, onComplete) {
      cancelRoulette();
      setBombPhase("roulette");
      rouletteEl.classList.add("show", "spinning");
      rouletteEl.classList.remove("landed");
      rouletteEl.setAttribute("aria-hidden", "false");
      rouletteNumEl.textContent = "1";

      const spins = 18 + Math.floor(Math.random() * 10);
      let step = 0;

      function tick() {
        if (step >= spins) {
          playRouletteLandSound(finalN);
          rouletteEl.classList.remove("spinning");
          rouletteEl.classList.add("landed");
          rouletteNumEl.textContent = String(finalN);
          rouletteStepTimer = setTimeout(() => {
            rouletteStepTimer = null;
            cancelRoulette();
            onComplete();
          }, 500);
          return;
        }
        playRouletteTickSound(step, spins);
        rouletteNumEl.textContent = String(1 + (step % 5));
        void rouletteNumEl.offsetWidth;
        rouletteEl.classList.remove("spinning");
        rouletteEl.classList.add("spinning");
        step++;
        const progress = step / spins;
        const delay = Math.round(50 + progress * progress * 200);
        rouletteStepTimer = setTimeout(tick, delay);
      }

      tick();
    }

    function setBombPhase(phase) {
      bombPhase = phase;
      wrap.classList.toggle("bomb-picking", phase === "picking");
      updateBonusButton();
    }

    function activateBonus() {
      if (!gameRunning || bonusCredits < 1 || bombPhase !== "idle") return;
      try {
        ensureAudio();
      } catch (_) {}
      bonusCredits--;
      updateBonusButton();
      const n = 1 + Math.floor(Math.random() * 5);
      bombPicksLeft = n;
      runBombRoulette(n, () => {
        setBombPhase("announcing");
        showBombToast("폭탄 " + n + "개 획득!");
        if (bombToastTimer) clearTimeout(bombToastTimer);
        bombToastTimer = setTimeout(() => {
          bombToastTimer = null;
          hideBombToast();
          setBombPhase("picking");
          draw();
        }, BOMB_TOAST_MS);
      });
    }

    function applyBombAt(c, r) {
      const cell = getCell(c, r);
      if (!cell || cell.state === "empty") return false;
      playBombSound();
      setCell(c, r, makeEmpty());
      bombPicksLeft--;
      popEffects.push({ c, r, until: performance.now() + 280 });
      syncViewport();
      scheduleLayout();
      if (bombPicksLeft <= 0) setBombPhase("idle");
      else draw();
      checkGameEnd();
      return true;
    }

    function addScore(n) {
      score += n * SCORE_PER_TILE;
      scoreEl.textContent = String(score);
      if (score > highScore) {
        highScore = score;
        highEl.textContent = String(highScore);
        try {
          localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
        } catch (_) {}
      }
      grantBonusMilestones();
    }

    function breakNeighborsOf(pairCells) {
      const adj = uniqueNeighborCells(pairCells);
      const toReveal = [];
      for (const [c, r] of adj) {
        if (pairCells.some(([pc, pr]) => pc === c && pr === r)) continue;
        if (c < 0 || c >= HEX_COLS) continue;
        ensureRowExists(r);
        let cell = getCell(c, r);
        if (!cell) {
          cell = makeHidden(randValue());
          setCell(c, r, cell);
        }
        if (cell.state !== "hidden") continue;
        toReveal.push([c, r, cell]);
      }
      const values = assignRevealValues(toReveal);
      for (let i = 0; i < toReveal.length; i++) {
        const [c, r, cell] = toReveal[i];
        cell.value = values[i];
        cell.state = "revealed";
        popEffects.push({ c, r, until: performance.now() + 280 });
      }
      if (toReveal.length > 0) {
        tilesBroken += toReveal.length;
        addScore(toReveal.length);
      }
      return toReveal.length;
    }

    function collapseMergedCell(c, r) {
      setCell(c, r, makeEmpty());
    }

    function hasHiddenInView() {
      const topRow = getViewTopRow();
      for (let r = topRow; r <= viewBottomRow; r++) {
        for (let c = 0; c < HEX_COLS; c++) {
          const cell = getCell(c, r);
          if (cell && cell.state === "hidden") return true;
        }
      }
      return false;
    }

    function shouldEndGame() {
      if (!hasHiddenInView()) return true;
      if (revealedTileCount() < 2) return true;
      return !hasMergeMove();
    }

    function checkGameEnd() {
      if (!gameRunning || mergeCount < 1) return;
      syncViewport();
      if (shouldEndGame()) endGame();
    }

    function applyMergeTen(fromC, fromR, toC, toR) {
      if (!canMergeCells(fromC, fromR, toC, toR)) return;
      mergeCount++;
      const pairCells = [
        [fromC, fromR],
        [toC, toR],
      ];
      const broken = breakNeighborsOf(pairCells);
      playClearSound(2 + broken);
      collapseMergedCell(fromC, fromR);
      collapseMergedCell(toC, toR);
      syncViewport();
      scheduleLayout();
    }

    function pathHexAt(cx, cy) {
      const s = hexSize * 0.92;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const ang = (Math.PI / 180) * (60 * i - 30);
        const hx = cx + s * Math.cos(ang);
        const hy = cy + s * Math.sin(ang);
        if (i === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
      }
      ctx.closePath();
    }

    function drawHex(cx, cy, fillStyle, strokeStyle, lineW) {
      pathHexAt(cx, cy);
      ctx.fillStyle = fillStyle;
      ctx.fill();
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineW;
      ctx.stroke();
    }

    function drawClearPopHex(cx, cy) {
      if (!clearPopReady) return false;
      const s = hexSize * 0.92;
      const w = Math.sqrt(3) * s;
      const h = 2 * s;
      const iw = clearPopImage.naturalWidth;
      const ih = clearPopImage.naturalHeight;
      if (!iw || !ih) return false;
      ctx.save();
      pathHexAt(cx, cy);
      ctx.clip();
      const scale = Math.max(w / iw, h / ih);
      const dw = iw * scale;
      const dh = ih * scale;
      ctx.drawImage(clearPopImage, cx - dw / 2, cy - dh / 2, dw, dh);
      ctx.restore();
      return true;
    }

    function drawRevealedNumber(cx, cy, val, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha == null ? 1 : alpha;
      pathHexAt(cx, cy);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
      ctx.lineWidth = 1.2;
      ctx.stroke();
      const fs = Math.max(13, Math.round(hexSize * 0.58));
      ctx.font = "700 " + fs + "px system-ui,sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = Math.max(2, fs * 0.14);
      ctx.strokeStyle = "rgba(26, 74, 138, 0.85)";
      ctx.fillStyle = "#ffffff";
      ctx.strokeText(String(val), cx, cy);
      ctx.fillText(String(val), cx, cy);
      ctx.restore();
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      let w = wrap.clientWidth;
      let h = wrap.clientHeight;
      if (w < 1) w = window.innerWidth;
      if (h < 1) {
        const hud = document.getElementById("ch-hud");
        h = window.innerHeight - (hud ? hud.offsetHeight : 48);
      }
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const vertSpan = VISIBLE_ROWS * 1.5 + 0.5;
      const horizSpan = Math.sqrt(3) * (HEX_COLS + 0.5);
      hexSize = Math.min(w / horizSpan, h / vertSpan) * 0.96;
      const gridW = hexSize * horizSpan;
      const gridH = hexSize * VISIBLE_ROWS * 1.5;
      originX = (w - gridW) / 2 + hexSize * Math.sqrt(3) / 2;
      originY = h - gridH - hexSize * 0.35;
    }

    function draw() {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      ctx.fillStyle = "#bcdcff";
      ctx.fillRect(0, 0, w, h);

      const topRow = getViewTopRow();
      const cells = [];
      for (let r = topRow; r <= viewBottomRow; r++) {
        for (let c = 0; c < HEX_COLS; c++) {
          let cell = getCell(c, r);
          if (!cell) continue;

          const { x, y } = hexCenter(c, r);
          const val = getRevealedValue(c, r);
          const isDragSource =
            drag && drag.fromC === c && drag.fromR === r && drag.active;

          if (cell.state === "empty") {
            drawHex(x, y, "#bcdcff", "rgba(26,74,138,0.15)", 1);
            continue;
          }

          if (cell.state === "revealed") {
            drawHex(x, y, "#bcdcff", "rgba(26, 74, 138, 0.2)", 1);
          }

          if (cell.state === "hidden") {
            if (!drawClearPopHex(x, y)) {
              drawHex(x, y, "#ffffff", "rgba(26,74,138,0.2)", 1.2);
            } else {
              pathHexAt(x, y);
              ctx.strokeStyle = "rgba(26,74,138,0.2)";
              ctx.lineWidth = 1.2;
              ctx.stroke();
            }
          }

          if (bombPhase === "picking" && cell.state !== "empty") {
            drawHex(x, y, "rgba(255, 107, 107, 0.22)", "#ff6b6b", 2);
          }

          const canMergeHere =
            bombPhase === "idle" &&
            drag &&
            drag.active &&
            !isDragSource &&
            val != null &&
            canMergeCells(drag.fromC, drag.fromR, c, r);
          const isHover =
            drag &&
            drag.active &&
            drag.hoverC === c &&
            drag.hoverR === r &&
            canMergeHere;
          if (canMergeHere) {
            drawHex(x, y, "rgba(255, 230, 102, 0.32)", "#ffb703", 2);
          }
          if (isHover) {
            drawHex(x, y, "rgba(255, 230, 102, 0.55)", "#ffb703", 2.5);
          }
          const pop = popEffects.find((e) => e.c === c && e.r === r);
          if (pop && cell.state === "hidden") {
            drawHex(x, y, "rgba(255,230,102,0.35)", "#ffb703", 2);
          }
          if (val != null && !isDragSource) cells.push({ x, y, val });
        }
      }
      for (const cell of cells) drawRevealedNumber(cell.x, cell.y, cell.val, 1);

      if (drag && drag.active && drag.value != null) {
        drawRevealedNumber(drag.x, drag.y, drag.value, 0.95);
      }

      popEffects = popEffects.filter((e) => e.until > performance.now());

      if (bombPhase === "picking" && bombPicksLeft > 0) {
        ctx.save();
        ctx.font = "700 15px system-ui,sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillStyle = "rgba(26, 74, 138, 0.9)";
        ctx.fillText("남은 폭탄 " + bombPicksLeft + "개 — 타일을 탭하세요", w / 2, 10);
        ctx.restore();
      }
    }

    function endGame() {
      if (!shouldEndGame()) return;
      if (bombToastTimer) {
        clearTimeout(bombToastTimer);
        bombToastTimer = null;
      }
      cancelRoulette();
      hideBombToast();
      setBombPhase("idle");
      gameRunning = false;
      endMsgEl.textContent =
        "축하합니다 " + score + "점수를 획득하였습니다.";
      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden", "false");
    }

    function startGame() {
      score = 0;
      mergeCount = 0;
      tilesBroken = 0;
      bonusCredits = 0;
      bonusMilestonesGranted = 0;
      bombPicksLeft = 0;
      if (bombToastTimer) {
        clearTimeout(bombToastTimer);
        bombToastTimer = null;
      }
      cancelRoulette();
      hideBombToast();
      setBombPhase("idle");
      scoreEl.textContent = "0";
      popEffects = [];
      fillInitialBoard();
      gameRunning = true;
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
      updateBonusButton();
      syncViewport();
      scheduleLayout();
    }

    function pointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        px: e.clientX - rect.left,
        py: e.clientY - rect.top,
      };
    }

    function onPointerDown(e) {
      if (!gameRunning) return;
      e.preventDefault();
      const { px, py } = pointerPos(e);

      if (bombPhase === "announcing" || bombPhase === "roulette") return;

      if (bombPhase === "picking") {
        const hit = pixelToHexAny(px, py);
        if (hit) applyBombAt(hit[0], hit[1]);
        return;
      }

      const hit = pixelToHex(px, py, true);
      if (!hit) return;
      const [c, r] = hit;
      const v = getRevealedValue(c, r);
      if (v == null) return;
      drag = {
        fromC: c,
        fromR: r,
        value: v,
        startX: px,
        startY: py,
        x: px,
        y: py,
        active: true,
        hoverC: null,
        hoverR: null,
      };
      try {
        canvas.setPointerCapture(e.pointerId);
      } catch (_) {}
      canvas.classList.add("dragging");
      draw();
    }

    function onPointerMove(e) {
      if (bombPhase !== "idle") return;
      if (!drag || !drag.active) return;
      const { px, py } = pointerPos(e);
      drag.x = px;
      drag.y = py;
      let hit = pixelToHex(drag.x, drag.y, true, drag.fromC, drag.fromR);
      if (
        hit &&
        canMergeCells(drag.fromC, drag.fromR, hit[0], hit[1])
      ) {
        drag.hoverC = hit[0];
        drag.hoverR = hit[1];
      } else {
        hit = nearestMergeableAt(drag.fromC, drag.fromR, drag.x, drag.y);
        drag.hoverC = hit ? hit[0] : null;
        drag.hoverR = hit ? hit[1] : null;
      }
      draw();
    }

    let dragEnding = false;

    function finishDrag(e) {
      if (bombPhase !== "idle") return;
      if (!drag || !drag.active || dragEnding) return;
      dragEnding = true;
      canvas.classList.remove("dragging");
      const {
        fromC,
        fromR,
        value,
        startX,
        startY,
        x: lastX,
        y: lastY,
        hoverC,
        hoverR,
      } = drag;
      const pos = e ? pointerPos(e) : { px: lastX, py: lastY };
      const dragDist = Math.hypot(pos.px - startX, pos.py - startY);
      const hit = pixelToHex(pos.px, pos.py, true, fromC, fromR);
      drag.active = false;
      drag = null;
      try {
        if (e) canvas.releasePointerCapture(e.pointerId);
      } catch (_) {}

      const minDrag = Math.max(MIN_DRAG_MERGE_PX, hexSize * 0.35);
      if (dragDist < minDrag) {
        dragEnding = false;
        draw();
        return;
      }

      const target = resolveMergeTarget(
        fromC,
        fromR,
        value,
        pos.px,
        pos.py,
        hit ? hit[0] : null,
        hit ? hit[1] : null,
        hoverC,
        hoverR
      );
      dragEnding = false;
      if (target) {
        applyMergeTen(fromC, fromR, target[0], target[1]);
        draw();
        setTimeout(() => {
          syncViewport();
          scheduleLayout();
          checkGameEnd();
        }, 320);
      } else {
        draw();
      }
    }

    function onPointerUp(e) {
      finishDrag(e);
    }

    try {
      highScore = parseInt(localStorage.getItem(HIGH_SCORE_KEY) || "0", 10) || 0;
    } catch (_) {}
    highEl.textContent = String(highScore);

    bonusBtn.addEventListener("click", () => {
      activateBonus();
    });

    document.getElementById("ch-home-btn").addEventListener("click", () => {
      location.href = "./apple_game.html";
    });
    endHomeBtn.addEventListener("click", () => {
      location.href = "./apple_game.html";
    });

    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);
    function onLayoutChange() {
      scheduleLayout();
    }

    window.addEventListener("resize", onLayoutChange);
    window.addEventListener("orientationchange", onLayoutChange);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", onLayoutChange);
      window.visualViewport.addEventListener("scroll", onLayoutChange);
    }

    startGame();
    requestAnimationFrame(() => {
      function loop() {
        if (popEffects.length) draw();
        requestAnimationFrame(loop);
      }
      loop();
    });
  </script>
</body>
</html>
